name: JarvisManager
options:
  bundleIdPrefix: com.jarvis
  minimumXcodeVersion: "16.0"
  deploymentTarget:
    macOS: "13.0"

targets:
  JarvisManager:
    type: application
    platform: macOS
    sources:
      - path: JarvisManager
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvis.manager
        PRODUCT_NAME: Jarvis Manager
        SWIFT_VERSION: 5.0
        MACOSX_DEPLOYMENT_TARGET: 13.0
        INFOPLIST_FILE: JarvisManager/Info.plist
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: JarvisManager/JarvisManager.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
